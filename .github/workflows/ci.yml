name: tests
on: [push, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
            - run: sudo apt-get update && sudo apt-get install -y libsndfile1
            - run: pip install -r requirements.txt
            - run: pip install -e .
            - run: pytest -q

    docker:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t accent-recognition .
            - name: Smoke test the container
              run: |
                  docker run -d --name app -p 8000:8000 accent-recognition
                  for i in $(seq 1 30); do
                      curl -fsS http://127.0.0.1:8000/health && break
                      sleep 2
                  done
                  curl -fsS http://127.0.0.1:8000/health
                  curl -fsS http://127.0.0.1:8000/ | grep -q "Accent Recognition"
                  docker logs app
